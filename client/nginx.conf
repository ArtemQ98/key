server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    root /usr/share/nginx/html;
    index index.html;

    location /uploads/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Хешированные ассеты — если файла нет, отдаём 404, а не index.html.
    # Это критично для корректной работы vite:preloadError в браузере.
    location ~* \.(js|mjs|css|png|jpg|jpeg|gif|svg|ico|webp|avif|woff|woff2|ttf|eot|map)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html — всегда свежий
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # manifest и Service Worker — без кэша
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }
    location = /OneSignalSDKWorker.js {
        add_header Cache-Control "no-cache";
    }
    location = /OneSignalSDKUpdaterWorker.js {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — только для HTML-роутов
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}