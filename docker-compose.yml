services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: key
      POSTGRES_USER: key
      POSTGRES_PASSWORD: key
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U key -d key"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./server
    volumes:
      - uploads_data:/app/uploads
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://key:key@db:5432/key?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      APP_DIR: ${APP_DIR:-/app}
      LISTEN_ADDR: ${LISTEN_ADDR:-:8080}
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy
  client:
    build: ./client
    ports: ["80:80"]
    depends_on: [api]
volumes:
  postgres_data:
  uploads_data:
